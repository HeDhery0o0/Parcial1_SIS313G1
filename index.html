<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Grupo Contable</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window">

    <div class="top-bar">
        <div class="sub">UNIDAD: 0252 &nbsp;&nbsp; Nivel Central</div>
        GRUPO CONTABLE
    </div>


    <div class="form">

        <div class="left">
            <label>Grupo</label>
            <input type="text" value="2">

            <label>Vida Útil</label>
            <input type="text" value="10">
        </div>

        <div class="right">
            <label>Nombre</label>
            <input type="text" value="MUEBLES Y ENSERES DE OFICINA">

            <label>Observaciones</label>
            <textarea></textarea>

            <div class="check">
                <input type="checkbox" checked>
                <label>Deprecia</label>
            </div>
        </div>

    </div>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">CODIGO</th>
                    <th>NOMBRE AUXILIAR</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td></td></tr>
                <tr><td>2</td><td></td></tr>
                <tr><td>3</td><td></td></tr>
                <tr><td>4</td><td></td></tr>
                <tr><td>5</td><td></td></tr>
                <tr><td>6</td><td></td></tr>
                <tr><td>7</td><td></td></tr>
                <tr><td>8</td><td></td></tr>
            </tbody>
        </table>
    </div>

    <div class="buttons">
        <button>Nuevo</button>
        <button>Modificar</button>
        <button>Eliminar</button>
        <button class="disabled">Deshacer</button>
        <button>Salir</button>
    </div>

</div>

</body>
</html>
